<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Runner — procedural night racing</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="vignette"></div>
  <div id="hud">
    <div class="eyebrow">NIGHT CIRCUIT</div>
    <div class="speed-label">SPEED</div>
    <div class="speed-readout">
      <span id="speed-value">092</span>
      <span class="unit">KM/H</span>
    </div>
    <div class="lap-card">
      <span class="lap-label">LAP</span>
      <span id="lap-count">1</span>
      <span id="lap-value">00:00.0</span>
    </div>
    <div id="status-value">RUN</div>
  </div>
  <div class="controls">
    <p>DRIVE WITH YOUR KEYBOARD</p>
    <p><b>W / ↑</b> accelerate &nbsp; <b>S / ↓</b> brake</p>
    <p><b>A / ←</b> steer left &nbsp; <b>D / →</b> steer right</p>
    <p class="audio-note">Engine audio starts when you press a control key.</p>
  </div>
  <div id="watermark">NEON RUNNER · PROCEDURAL AUDIO &amp; TEXTURES</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
