<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEON RUSH — Procedural Racing</title>
    <style>:root{--hot:#ff4f5e;--cyan:#38e8ff;--amber:#ffc23d;--ink:#050610}*{box-sizing:border-box}html,body{height:100%;margin:0}body{color:#e8f5ff;background:radial-gradient(circle at 50% 20%,#171133,#050610 70%);font-family:Arial Black,Helvetica Neue,Arial,sans-serif;overflow:hidden}#renderer{display:block;position:fixed;top:0;bottom:0;left:0;right:0;width:100%!important;height:100%!important}#loading{z-index:40;color:#efe7ff;background:linear-gradient(160deg,#050610,#130c26);flex-direction:column;justify-content:center;align-items:center;gap:12px;transition:opacity .25s linear;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#loading h1{letter-spacing:5px;color:var(--cyan);text-shadow:0 0 22px #38e8ff8c;margin:0;font-size:48px}#loading p{letter-spacing:2px;color:#aab5d6;margin:0;font-size:13px}.hidden{opacity:0;pointer-events:none}#hud{z-index:10;pointer-events:none;padding:18px 28px;font-family:Arial Black,Helvetica Neue,Arial,sans-serif;position:fixed;top:0;bottom:0;left:0;right:0}#hud .title{letter-spacing:3.5px;color:#8e9ec6;text-shadow:0 0 10px #8e9ec64d;font-size:13px;position:absolute;top:18px;left:28px}#hud .title span{color:var(--hot)}#hud .speed-card{text-align:right;background:linear-gradient(135deg,#060914d6,#140c2299);border:1px solid #ff4f5e6b;border-radius:12px;min-width:250px;padding:12px 18px;position:absolute;top:22px;right:30px;box-shadow:0 0 28px #ff4f5e2e,inset 0 0 20px #ff4f5e14}#hud .speed-card .tag{letter-spacing:2.5px;color:#8e9ec6;margin-bottom:2px;font-size:10px}#hud .speed-card .num{letter-spacing:1px;color:var(--amber);text-shadow:0 0 22px #ffc23d80;font-size:48px;line-height:1}#hud .speed-card .unit{letter-spacing:2px;color:#aab5d6;margin-left:6px;font-size:12px}#hud .race-card{background:#05081099;border:1px solid #38e8ff47;border-radius:10px;min-width:230px;padding:11px 16px;position:absolute;top:58px;left:28px;box-shadow:0 0 24px #38e8ff24}#hud .race-card .label{letter-spacing:2.5px;color:#8ea9c5;margin-bottom:2px;font-size:10px}#hud .race-card .lap{color:var(--cyan);text-shadow:0 0 18px #38e8ff59;font-size:25px}#hud .race-card .time{color:#e3efff;margin-left:8px;font-size:16px}#hud .race-card .opps{letter-spacing:1.5px;color:#a5b3ca;margin-top:5px;font-size:10px}#hud .notice{letter-spacing:2px;color:#aab5d6;white-shadow:none;background:#04081280;border:1px solid #38e8ff40;border-radius:999px;padding:7px 14px;font-size:11px;position:absolute;bottom:20px;left:50%;transform:translate(-50%)}#hud .controls{letter-spacing:1.5px;color:#b6c2d8;background:#0408127a;border:1px solid #ff4f5e33;border-radius:10px;flex-wrap:wrap;justify-content:center;gap:10px;min-width:260px;padding:8px 16px;font-size:10px;display:flex;position:absolute;bottom:20px;left:50%;transform:translate(-50%)}#hud .controls .key{color:#ffc23d;background:#ffc23d17;border:1px solid #ffc23d33;border-radius:6px;padding:4px 8px}#hud .edge{color:var(--hot);letter-spacing:2px;opacity:.8;font-size:10px;transition:opacity .15s;position:absolute;bottom:50px;left:50%;transform:translate(-50%)}@media (max-width:720px){#hud .title{top:12px;left:16px}#hud .speed-card{min-width:210px;padding:10px 12px;top:12px;right:16px}#hud .speed-card .num{font-size:34px}#hud .race-card{min-width:180px;padding:8px 12px;top:46px;left:16px}}</style>
    <script type="module" crossorigin src="./assets/index-2hXmaq3J.js"></script>
  </head>
  <body>
    <canvas id="renderer"></canvas>
    <div id="loading"><h1>NEON RUSH</h1><p>BUILDING THE WORLD FROM NOISE...</p></div>
    <div id="hud">
      <div class="title">NEON <span>RUSH</span></div>
      <div class="speed-card">
        <div class="tag">CAR VELOCITY</div>
        <div id="speedNum" class="num">0</div><span id="speedUnit" class="unit">KM/H</span>
      </div>
      <div class="race-card">
        <div class="label">RACE TIMER</div>
        <div id="lap">LAP <span id="lapNum">1</span></div>
        <div id="lapTime" class="time">0.00s</div>
        <div id="opps" class="opps">3 opponents online</div>
      </div>
      <div id="edge" class="edge"></div>
      <div id="controls" class="controls">
        <span class="key">↑ / W</span> ACCELERATE
        <span class="key">↓ / S</span> BRAKE
        <span class="key">← / A</span> STEER LEFT
        <span class="key">→ / D</span> STEER RIGHT
        <span class="key">R</span> RESET
        <span class="key">M</span> MUTE
      </div>
    </div>
  </body>
</html>
