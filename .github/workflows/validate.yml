name: validate
# Untrusted PR code runs here with a read-only token and no secrets; automerge.yml decides on the result.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test harness/test/harness.test.mjs
      - run: node harness/validate.mjs
      - run: node site/build.mjs
      - if: github.event_name == 'pull_request'
        run: echo "${{ github.event.number }}" > pr.txt
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: pr.txt
