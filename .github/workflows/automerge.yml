name: automerge
# Runs the base branch's copy of this file with a write token, after validate.yml passes on a PR. It never checks out
# PR code: it reads the PR number, re-checks the head commit and the changed files through the API, and merges only a
# PR that adds files inside ONE new submission folder under results/ or previews/.
on:
  workflow_run:
    workflows: [validate]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: merge a submission-only PR
        run: |
          set -euo pipefail
          PR=$(head -c 12 pr.txt | tr -d '\n')
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "bad PR number"; exit 1; }
          read -r state draft head < <(gh pr view "$PR" --json state,isDraft,headRefOid -q '"\(.state) \(.isDraft) \(.headRefOid)"')
          [ "$state" = OPEN ] && [ "$draft" = false ] || { echo "PR $PR is not an open, ready PR"; exit 0; }
          [ "$head" = "$HEAD_SHA" ] || { echo "PR $PR moved since validation"; exit 0; }
          gh api "repos/$GH_REPO/pulls/$PR/files" --paginate -q '.[] | "\(.status) \(.filename)"' > files.txt
          if grep -qv '^added ' files.txt; then echo "PR $PR changes existing files: a maintainer merges it"; exit 0; fi
          if grep -Eqv '^added (results|previews)/[a-z0-9-]+/v[0-9]+/[0-9]{4}-[0-9]{2}-[0-9]{2}_[a-z0-9][a-z0-9._-]*/' files.txt; then
            echo "PR $PR adds files outside a submission folder: a maintainer merges it"; exit 0
          fi
          [ "$(cut -d' ' -f2 files.txt | cut -d/ -f1-4 | sort -u | wc -l)" -eq 1 ] || { echo "one submission per PR"; exit 0; }
          # A new submission only: added files inside someone else's folder (a made-up run-2) are not one.
          DIR=$(head -1 files.txt | cut -d' ' -f2 | cut -d/ -f1-4)
          if found=$(gh api "repos/$GH_REPO/contents/$DIR?ref=main" 2>&1); then
            echo "$DIR already exists on main: a maintainer merges it"; exit 0
          fi
          grep -q 'HTTP 404' <<<"$found" || { echo "could not check $DIR on main: $found"; exit 1; }
          gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA"
          gh workflow run pages.yml --ref main
